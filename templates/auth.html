<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tourism | Account</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <div class="brand-badge">
        <span class="brand-icon">ST</span>
        <span class="brand-title">Smart Tourism</span>
      </div>

      <div id="loginSection" class="auth-section">
        <header class="auth-header">
          <span class="tagline">EXPLORE MORE</span>
          <h2>Welcome Back</h2>
          <p>Sign in to plan your next memorable trip</p>
        </header>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="input-box">
            <input 
              type="text" 
              id="loginUsername" 
              placeholder="Username or Email" 
              required 
              autocomplete="username"
            />
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>

          <div class="input-box">
            <input 
              type="password" 
              id="loginPassword" 
              placeholder="Password" 
              required 
              autocomplete="current-password"
            />
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </div>

          <div class="form-options">
            <label class="remember-wrap">
              <input type="checkbox" id="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit" id="loginBtn">Sign In</button>

          <footer class="auth-footer">
            <p>Don't have an account? <button type="button" class="toggle-btn" id="goToRegister">Register</button></p>
          </footer>
        </form>
      </div>

      <div id="registerSection" class="auth-section hidden">
        <header class="auth-header">
          <span class="tagline">GET STARTED</span>
          <h2>Create Account</h2>
          <p>Join Smart Tourism to discover curated attractions</p>
        </header>

        <form id="registerForm" class="auth-form" novalidate>
          <div class="input-box">
            <input 
              type="text" 
              id="regUsername" 
              placeholder="Full Name / Username" 
              required 
              autocomplete="name"
            />
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>

          <div class="input-box">
            <input 
              type="email" 
              id="regEmail" 
              placeholder="Email address" 
              required 
              autocomplete="email"
            />
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </div>

          <div class="input-box">
            <input 
              type="password" 
              id="regPassword" 
              placeholder="Create password" 
              required 
              autocomplete="new-password"
            />
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </div>

          <button type="submit" class="btn-submit" id="regBtn">Create Account</button>

          <footer class="auth-footer">
            <p>Already have an account? <button type="button" class="toggle-btn" id="goToLogin">Sign In</button></p>
          </footer>
        </form>
      </div>

    </div>
  </main>

  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
